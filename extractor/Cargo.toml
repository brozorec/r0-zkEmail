[package]
name = "extractor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "extractor"
path = "src/main.rs"

[dependencies]
risc0-zkvm = { version = "3.0.2" }
anyhow = "1.0.93"
bincode = "1.3"
serde_json = "1.0"
hex = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4.22"
sha2 = "0.10"
zkemail-core = { path = "../core" }
