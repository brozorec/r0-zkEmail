[package]
name = "smtp-receiver"
version = "0.1.0"
edition = "2021"

[features]
default = []
verify = ["host", "hex"]
cuda = ["verify", "host/cuda"]

[dependencies]
# SMTP server
mailin-embedded = "0.8"

# Async runtime
tokio = { version = "1.41.1", features = ["full"] }

# Integration with existing crates (optional for macOS builds)
host = { path = "../host", optional = true }
zkemail-core = { path = "../core" }

# Error handling
anyhow = "1.0.93"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4.22"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File operations
chrono = "0.4"

# Email parsing
mailparse = "0.15"
email-parser = { path = "../email-parser" }

# Config
toml = "0.8"

# Hex encoding (only needed with verify feature)
hex = { version = "0.4", optional = true }

# Crypto provider for rustls (required on some platforms)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
