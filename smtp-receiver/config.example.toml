# SMTP Receiver Configuration Example
# Copy this file to config.toml and adjust settings

[smtp]
# Address to bind the SMTP server
# Use "0.0.0.0" to listen on all interfaces
# Use "127.0.0.1" for localhost only
bind_address = "0.0.0.0"

# SMTP port
# 25 = Standard SMTP (requires root/setcap)
# 587 = Submission port (requires root/setcap)
# 2525 = Alternative port for testing (no special privileges)
port = 2525

# Maximum email size in bytes (50 MB default)
max_message_size = 52428800

# List of allowed sender domains (empty = allow all)
# Example: ["gmail.com", "outlook.com", "example.com"]
allowed_domains = []

[smtp.tls]
cert_path = "./certs/cert.pem"
key_path = "./certs/key.pem"

[storage]
# Directory to store received .eml files
email_dir = "./received_emails"

# Directory to store verification proofs (JSON)
proof_dir = "./proofs"

[processing]
# Validate that emails contain expected payment/passkey data format before storing
# If true, only emails with valid payment data or passkey blocks are saved
# If false, all emails are saved regardless of content
validate_email_format = true

[runpod]
# Remote verification endpoint (used when binary is built without `verify` feature)
runpod_url = "https://nacgo2o3dv4i5h.api.runpod.ai/generate"
runpod_key = "RUNPOD_API_KEY"

# Number of attempts for Runpod verification (default: 3)
retry_attempts = 3

# Delay between retries in deciseconds (default: 10 = 1s)
retry_delay_decs = 10
