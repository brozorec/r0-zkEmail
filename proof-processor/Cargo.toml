[package]
name = "proof-processor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "proof-processor"
path = "src/main.rs"

[dependencies]
# Core dependencies
anyhow = "1.0"
tokio = { version = "1.41", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"

# Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Serialization
bincode = "1.3"
serde_json = "1.0"

# File watching
notify = "6.1"

# Crypto
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# HTTP client for relayer
reqwest = { version = "0.12", features = ["json"] }

# Stellar/RISC0
risc0-zkvm = { version = "1.2" }
stellar-xdr = { version = "22", features = ["curr"] }
stellar-strkey = "0.0.9"

# Local dependencies
zkemail-core = { path = "../core" }
methods = { path = "../methods" }
