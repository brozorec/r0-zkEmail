[package]
name = "prove-api"
version = "0.1.0"
edition = "2021"

[dependencies]
host = { path = "../host" }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

[features]
default = []
cuda = ["host/cuda"]
